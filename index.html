<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Главная</title>
    <style>
        body {
            background-color: #0d0e12;
            color: #f5f5f7;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            height: 100vh;
            margin: 0;
            overflow: hidden;
            letter-spacing: -0.5px;
        }

        /* === СТРОЧКА ТЕКСТА: Мягкий неоновый минимализм === */
        .neon-text {
            font-size: 2.2rem;
            font-weight: 500;
            text-align: center;
            color: #fff;
            /* Деликатное, не бьющее в глаза розовое свечение */
            text-shadow: 
                0 0 10px rgba(255, 0, 127, 0.5),
                0 0 25px rgba(255, 0, 127, 0.3);
            margin-bottom: 40px;
        }

        /* Кнопка "Дальше": Сбалансированный акцент */
        .neon-btn {
            padding: 12px 30px;
            font-size: 0.95rem;
            background: transparent;
            color: #00ffff;
            border: 1px solid rgba(0, 255, 255, 0.4);
            border-radius: 6px;
            cursor: pointer;
            text-decoration: none;
            letter-spacing: 1px;
            box-shadow: 0 0 15px rgba(0, 255, 255, 0.1);
            transition: all 0.4s ease;
        }

        /* Плавное раскрытие неона при наведении */
        .neon-btn:hover {
            color: #0d0e12;
            background: #00ffff;
            border-color: #00ffff;
            box-shadow: 0 0 25px rgba(0, 255, 255, 0.6);
        }
    </style>
</head>
<body>

    <!-- Выделенная строчка без капса и мигания -->
    <h1 class="neon-text">прости меня пожалуйста</h1>

    <!-- Кнопка перехода -->
    <a href="love.html" class="neon-btn">дальше</a>

</body>
</html>
